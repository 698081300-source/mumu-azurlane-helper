name: 观察 Alas 上游

# 节奏（2026-10-22 用户定）：
#   平时      → 每天只写一条（2 小时一次的其它几次跑到就退出，不打扰）
#   大节点    → 每 2 小时查，新活动图一出现就自动退回每天一次
# 只读上游 + 往仓库里写一个 md 文件，**不改线上表、不动用户的壳**。

on:
  schedule:
    - cron: "5 */2 * * *"        # 每 2 小时（UTC 整点后 5 分）
  workflow_dispatch:
    inputs:
      force:
        description: 强制发一条报告（测试用）
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: watch-alas
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 查一次上游
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python tools/watch_alas.py --ci --force
          else
            python tools/watch_alas.py --ci
          fi

      - name: 有变化就提交
        run: |
          git config user.name  "alas-watch"
          git config user.email "actions@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "今天没什么新东西，不提交"
          else
            git commit -m "watch: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
